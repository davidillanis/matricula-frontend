<h1>Lista de Curso</h1>

<div class="demo-button-container">
  <button mat-raised-button class="demo-button" (click)="agregarNuevoCurso()">
    <mat-icon>add</mat-icon>
    Nuevo Curso
  </button>
</div>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z8 demo-table">
  <ng-container matColumnDef="nombre">
    <th mat-header-cell *matHeaderCellDef>Nombre</th>
    <td mat-cell *matCellDef="let element">{{element.nombreCurso}}</td>
  </ng-container>
  <ng-container matColumnDef="nivel">
    <th mat-header-cell *matHeaderCellDef>Nivel</th>
    <td mat-cell *matCellDef="let element">{{element.nivel}}</td>
  </ng-container>
  <ng-container matColumnDef="capacidad">
    <th mat-header-cell *matHeaderCellDef>Capacidad</th>
    <td mat-cell *matCellDef="let element">{{element.capacidad}}</td>
  </ng-container>
  <ng-container matColumnDef="fechaInicio">
    <th mat-header-cell *matHeaderCellDef>Fecha Inicio</th>
    <td mat-cell *matCellDef="let element">{{formatFecha(element.fechaInicio)}}</td>
  </ng-container>
  <ng-container matColumnDef="fechaFin">
    <th mat-header-cell *matHeaderCellDef>Fecha Fin</th>
    <td mat-cell *matCellDef="let element">{{formatFecha(element.fechaFinalizacion)}}</td>
  </ng-container>
  <ng-container matColumnDef="profesor">
    <th mat-header-cell *matHeaderCellDef>Profesor</th>
    <td mat-cell *matCellDef="let element" (click)="modalProfesor(element.profesorEntidad)"><button mat-button>Ver
        Profesor</button></td>
  </ng-container>
  <ng-container matColumnDef="accion">
    <th mat-header-cell *matHeaderCellDef>Acción</th>
    <td mat-cell *matCellDef="let element">
      <button mat-raised-button class="demo-button" style="background-color: yellow;" (click)="editarCurso(element.idCurso)">
        <mat-icon>edit</mat-icon>
      </button>
      @if (!element.habilitado) {
        <button mat-raised-button class="demo-button" style="background-color: red;" (click)="desabilitarCurso(element.idCurso, true)">
          <mat-icon>visibility_off</mat-icon>
        </button>
      }
      @else {
        <button mat-raised-button class="demo-button" style="background-color: green;" (click)="desabilitarCurso(element.idCurso, false)">
          <mat-icon>visibility</mat-icon>
        </button>
      }
    </td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
