<h1>Lista de Matriculados</h1>

<div class="demo-button-container">
  <button mat-raised-button (click)="NuevaMatricua()" class="demo-button">
    Nueva Matricula
  </button>
</div>
<table mat-table [dataSource]="dataSource" class="mat-elevation-z8 demo-table">
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>Id</th>
    <td mat-cell *matCellDef="let element">{{element.idMatricula}}</td>
  </ng-container>
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Fecha</th>
    <td mat-cell *matCellDef="let element">{{formatFecha(element.fechaSolicitud)}}</td>
  </ng-container>
  <ng-container matColumnDef="symbol">
    <th mat-header-cell *matHeaderCellDef>Codigo Estudiante</th>
    <td mat-cell *matCellDef="let element">
      <button mat-button
        (click)="modalEstudiante(element.estudianteEntidad)">{{element.estudianteEntidad.codigoEstudiante}}</button>
    </td>
  </ng-container>
  <ng-container matColumnDef="cursos">
    <th mat-header-cell *matHeaderCellDef>Cursos</th>
    <td mat-cell *matCellDef="let element">
      <button mat-button (click)="modalCurso(element.cursoEntidad)">Ver Curso</button>
    </td>
  </ng-container>
  <ng-container matColumnDef="archivo">
    <th mat-header-cell *matHeaderCellDef>Archivos</th>
    <td mat-cell *matCellDef="let element">
      <form>
        <mat-form-field>
          <mat-label>Archivos</mat-label>
          <mat-select name="food">
            <mat-option><a (click)="mostrarImagenVoucher(element.urlVoucher)">Voucher de Pago</a></mat-option>
            <mat-option><a [href]="element.urlPdfMatricula" target="_blank">Ficha De Matricula</a></mat-option>
            <mat-option><a [href]="element.urlPdfDeclaracionJurada" target="_blank">Declaracion Jurada</a></mat-option>
            <mat-option><a [href]="element.urlPDFCartaCompromiso" target="_blank">Carta de compromiso</a></mat-option>
          </mat-select>
        </mat-form-field>
      </form>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
